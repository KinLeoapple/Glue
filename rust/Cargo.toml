[package]
name = "glue-rs"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
bumpalo = { version = "3", features = ["collections"] }
wide = "0.7"
rayon = "1"

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }

[[bin]]
name = "glue"
path = "src/main.rs"

[lib]
name = "glue_rs"
path = "src/lib.rs"
